name: preview
on:
  push:
    branches: [next-site]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tail -20
      - name: Build
        id: build
        run: |
          mkdir -p ci
          set +e
          npm run build > ci/build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -80 ci/build.log
      - name: Screenshots
        if: steps.build.outputs.code == '0'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          (npx next start -p 3000 > ci/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node scripts/shots.mjs > ci/shots.log 2>&1 || echo "shots failed" >> ci/shots.log
      - name: Netlify build (offline check)
        if: always()
        run: |
          set +e
          npx --yes netlify-cli@17 build --offline > ci/netlify-build.log 2>&1
          echo "netlify_code=$?" >> ci/netlify-build.log
          ls -la .netlify >> ci/netlify-build.log 2>&1
          find .netlify -maxdepth 3 -type d >> ci/netlify-build.log 2>&1
          tail -60 ci/netlify-build.log
      - name: Publish results to ci-out branch
        if: always()
        run: |
          echo "build_code=${{ steps.build.outputs.code }} sha=${{ github.sha }}" > ci/STATUS
          cd ci
          printf '[build]\n  ignore = "exit 0"\n' > netlify.toml
          git init -q -b ci-out
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "preview ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out
